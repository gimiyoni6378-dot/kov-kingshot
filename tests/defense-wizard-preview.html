<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>화염 마법사 전투 시안 · KOV</title><link rel="stylesheet" href="../defense.css?v=9"><style>body{padding:12px}.preview-heading{padding:12px 16px;background:#f4deb0}.preview-heading h1{font-size:20px;margin:0}.preview-heading p{font-size:12px;margin:8px 0 0;color:#865d32}.preview-mage{display:flex;align-items:center;gap:12px;padding:12px 16px}.preview-mage img{width:65px;height:85px;object-fit:contain}.preview-mage p{font-size:12px;line-height:1.7}.preview-note{font-size:11px;color:#795c37;padding:0 16px 12px}.preview-note a{color:inherit}</style></head><body><main class="game-shell"><header class="preview-heading"><h1>히든 · 화염 마법사</h1><p>실제 게임 렌더러로 보는 전투 시안 · 포인트 지급 없음</p></header><section class="preview-mage"><img src="../assets/defense/fire-mage.png" alt="붉은 망토의 화염 마법사"><p>HP 70 · 공격력 12 · 0.9초마다 전체 적 공격<br>스테이지마다 1% · 한 판에 한 번 · 성벽 전용</p></section><div class="battlefield"><canvas id="world" width="1210" height="1300" aria-label="성벽의 화염 마법사와 세 길을 공격하는 보병의 전투 시안"></canvas></div><p class="preview-note">개발용 시안에서는 캐릭터와 이펙트 확인을 위해 마법사가 등장하는 고정 시드를 사용합니다. 실제 게임의 1% 확률과 별개예요. <a href="../defense.html">회원 게임으로 →</a></p></main><script type="module">
import {DefenseGame,hiddenRoll} from '../defense-engine.js?v=5';
import {createDefenseRenderer} from '../defense-renderer.js?v=1';
const canvas=document.querySelector('canvas'),images={};
await Promise.all(Object.entries({background:'battlefield.png',troops:'troops.png',run:'enemy-run.png',pad:'stone-pad.png',fx:'combat-fx.png',wizard:'fire-mage.png'}).map(([name,path])=>new Promise((ok,fail)=>{const image=new Image();image.onload=()=>{images[name]=image;ok();};image.onerror=fail;image.src='../assets/defense/'+path;})));
let seed=0;while(hiddenRoll(seed,1)>=.01)seed++;
const game=new DefenseGame({},seed);function reset(){game.reset(seed);game.recruit(0,'wizard');game.recruit(1,'archer');game.recruit(2,'archer');game.recruit(3,'infantry');game.recruit(4,'infantry');game.recruit(5,'cavalry');game.wave=4;game.start();}reset();
const draw=createDefenseRenderer({canvas,game,images});let last=performance.now(),accumulator=0;
function frame(now){accumulator+=Math.min((now-last)/1000,.05);last=now;while(accumulator>=1/60){game.step(1/60);accumulator-=1/60;}if(game.phase!=='battle')reset();draw();requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></body></html>
